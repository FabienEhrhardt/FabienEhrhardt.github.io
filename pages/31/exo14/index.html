{
  id:"intro", icon:"📋", label:"Prise en main",
  html:`
  <h2 class="mtitle">Le contrôleur d'installation, à quoi ça sert ?</h2>
  <p class="subtitle">Vérifier qu'une installation électrique respecte la norme NF C 15-100 avant sa mise en service, et diagnostiquer une installation existante.</p>

  <div class="card">
  Le CA 6116N est un appareil de mesure portatif qui regroupe, sur un seul commutateur à 13 positions, toutes les mesures nécessaires à la <b>vérification réglementaire d'une installation basse tension</b> : tension, continuité, isolement, prise de terre, impédance de boucle, test des différentiels, courant, sens de rotation des phases, puissance et harmoniques.
  </div>

  <div class="section-title">Les commandes de l'appareil</div>
  <div class="wiring-box">
  <ul>
    <li><b>Commutateur central</b> : sélectionne la fonction de mesure (ou OFF / SET-UP).</li>
    <li><b>4 touches de fonction</b> : leur rôle change selon l'écran affiché (icônes en bas de l'écran).</li>
    <li><b>Bouton TEST</b> : lance la mesure.</li>
    <li><b>Pavé directionnel + OK</b> : navigation dans les menus et la mémoire.</li>
    <li><b>Touche d'aide (?)</b> : affiche le schéma de branchement de la fonction en cours — à utiliser sans hésiter en TP !</li>
    <li><b>Bornes</b> : L / N / PE (cordon tripode), Ω / COM (continuité), MΩ (isolement), H / S / E (terre 3P), RA SEL (piquet auxiliaire), I (pince ampèremétrique).</li>
  </ul>
  </div>

  <div class="section-title">La distinction la plus importante : sous tension ou hors tension ?</div>
  <div class="safety-box safety-tension"><span class="safety-icon">⚡</span> SOUS TENSION : l'installation reste alimentée. L'appareil injecte un courant très faible (quelques mA), sans danger, pour mesurer à travers l'installation en fonctionnement.</div>
  <div class="safety-box safety-hors"><span class="safety-icon">🔒</span> HORS TENSION : l'installation (ou la partie testée) doit être coupée et vérifiée hors tension avant de brancher l'appareil. Certaines mesures (isolement) génèrent elles-mêmes une tension d'essai dangereuse.</div>
  <p style="font-size:0.85rem;color:#555;margin-bottom:14px;">Avant toute mesure hors tension : coupez l'alimentation, <b>vérifiez l'absence de tension</b> (VAT) avec l'appareil lui-même (il affiche toujours la tension en entrant dans une fonction), consignez si besoin.</p>

  <div class="section-title">Vue d'ensemble des 13 mesures</div>
  <div class="recap-wrap">
  <table class="param-table">
  <tr><th>Mesure</th><th>Régime</th><th>Obligatoire NF C15-100 ?</th></tr>
  <tr><td>Tension</td><td><span class="pill pill-tension">Sous tension</span></td><td>Préalable systématique</td></tr>
  <tr><td>Continuité / Résistance</td><td><span class="pill pill-hors">Hors tension</span></td><td>Oui — continuité du PE</td></tr>
  <tr><td>Isolement</td><td><span class="pill pill-hors">Hors tension</span></td><td>Oui — résistance d'isolement</td></tr>
  <tr><td>Terre 3P</td><td><span class="pill pill-hors">Hors tension</span></td><td>Oui — si installation neuve / barrette ouverte</td></tr>
  <tr><td>Boucle Zs</td><td><span class="pill pill-tension">Sous tension</span></td><td>Oui — dimensionnement des protections (TN/TT)</td></tr>
  <tr><td>Terre sous tension (Ra/Za)</td><td><span class="pill pill-tension">Sous tension</span></td><td>Oui — schéma TT sans couper l'installation</td></tr>
  <tr><td>Terre sélective</td><td><span class="pill pill-tension">Sous tension</span></td><td>Complémentaire — plusieurs terres en parallèle</td></tr>
  <tr><td>Impédance de ligne Zi</td><td><span class="pill pill-tension">Sous tension</span></td><td>Oui — tout régime de neutre, notamment IT</td></tr>
  <tr><td>Test différentiel (RCD)</td><td><span class="pill pill-tension">Sous tension</span></td><td>Oui — obligatoire</td></tr>
  <tr><td>Courant / courant de fuite</td><td><span class="pill pill-tension">Sous tension</span></td><td>Diagnostic</td></tr>
  <tr><td>Sens de rotation de phase</td><td><span class="pill pill-tension">Sous tension</span></td><td>Avant raccordement moteur triphasé</td></tr>
  <tr><td>Puissance</td><td><span class="pill pill-tension">Sous tension</span></td><td>Diagnostic / bilan énergétique</td></tr>
  <tr><td>Harmoniques</td><td><span class="pill pill-tension">Sous tension</span></td><td>Diagnostic qualité du réseau</td></tr>
  </table>
  </div>

  <div class="section-title">Seuils réglementaires indicatifs à retenir</div>
  <div class="nfc-box">
  <b>Isolement</b> — R ≥ 0,25 MΩ sous 250 V DC (TBT / milieu humide) · R ≥ 0,5 MΩ sous 500 V DC (circuits ≤ 500 V, cas domestique standard) · R ≥ 1 MΩ sous 1000 V DC (circuits &gt; 500 V).<br><br>
  <b>Prise de terre (schéma TT)</b> — R<sub>A</sub> × I<sub>Δn</sub> ≤ U<sub>L</sub> (U<sub>L</sub> = 50 V en local sec, 25 V en local humide).<br><br>
  <b>Impédance de boucle Zs (schéma TN)</b> — Z<sub>s</sub> ≤ U<sub>0</sub> / I<sub>a</sub>, où I<sub>a</sub> est le courant qui assure le déclenchement du disjoncteur dans le temps de coupure maximal imposé (dépend du calibre et de la courbe du disjoncteur, voir tableau normatif).<br><br>
  <b>Différentiel</b> — doit déclencher entre I<sub>Δn</sub> et 2×I<sub>Δn</sub> en moins de 300 ms (type standard) ou 500 ms (type S), et ne doit pas déclencher à 0,5×I<sub>Δn</sub>.<br><br>
  Ces valeurs sont indicatives : reportez-vous toujours au tableau complet de la norme et au calibre réel des protections installées.
  </div>
  `
},

  nfc:"Permet de vérifier la tension nominale de l'installation et la présence effective du conducteur de protection avant toute mesure hors tension."

// ═══════════════════════════════════════════════
// CONSTRUCTION DES ONGLETS
// ═══════════════════════════════════════════════
function safetyBoxHtml(type){
  if(type==="tension") return `<div class="safety-box safety-tension"><span class="safety-icon">⚡</span> Mesure réalisée SOUS TENSION — l'installation reste alimentée.</div>`;
  if(type==="hors") return `<div class="safety-box safety-hors"><span class="safety-icon">🔒</span> Mesure réalisée HORS TENSION — coupez et vérifiez l'absence de tension avant de brancher l'appareil.</div>`;
  return "";
}

function buildMeasureTab(o){
  let paramRows = o.param.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td></tr>`).join("");
  let wiringItems = o.wiring.map(w=>`<li>${w}</li>`).join("");
  return `
  <h2 class="mtitle">${o.icon} ${o.label}</h2>
  ${safetyBoxHtml(o.safety)}
  <div class="card">${o.intro}</div>

  <div class="section-title">🔧 Branchement</div>
  <div class="wiring-box"><ul>${wiringItems}</ul></div>

  <div class="section-title">⚙️ Paramétrage à l'écran</div>
  <table class="param-table">${paramRows}</table>

  <div class="section-title">📊 Lecture du résultat</div>
  <div class="result-box">${o.result}</div>

  <div class="section-title">📐 Lien avec la NF C 15-100</div>
  <div class="nfc-box">${o.nfc}</div>
  `;
}

function buildTabs(){
  const nav = document.getElementById("tabsNav");
  const container = document.getElementById("tabsContainer");
  let navHtml = "";
  let contentHtml = "";

  onglets.forEach((o,i)=>{
    navHtml += `<button class="tab-btn${i===0?" active":""}" onclick="showTab('${o.id}',this)">${o.icon} ${o.label}</button>`;
    let bodyHtml = (o.id==="intro") ? o.html : buildMeasureTab(o);
    contentHtml += `<div id="tab-${o.id}" class="tab-content${i===0?" active":""}">${bodyHtml}</div>`;
  });

  // Onglet quiz
  navHtml += `<button class="tab-btn" onclick="showTab('quiz',this)">❓ Quiz final</button>`;
  contentHtml += `
  <div id="tab-quiz" class="tab-content">
    <h2 class="mtitle">❓ Quiz final — Avez-vous bien tout compris ?</h2>
    <p class="subtitle">10 questions pour vérifier votre maîtrise du CA 6116N et des mesures NF C 15-100.</p>
    <div class="score-bar"><span>Score : <b id="q-score">0</b> / <b id="q-total">0</b> questions répondues</span></div>
    <div id="questions-list"></div>
    <button id="send" onclick="envoyerScore()">Envoyer le résultat</button>
  </div>`;

  nav.innerHTML = navHtml;
  container.innerHTML = contentHtml;
}

function showTab(id, el){
  document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+id).classList.add("active");
  el.classList.add("active");
}

// ═══════════════════════════════════════════════
// QUIZ
// ═══════════════════════════════════════════════
let qScores = new Array(questions.length).fill(null);

function buildQuestions(){
  const list = document.getElementById("questions-list");
  list.innerHTML = "";
  questions.forEach((q, qi) => {
    const div = document.createElement("div");
    div.className = "question-block";
    const buttons = q.options.map((opt, oi) =>
      '<button class="q-opt" onclick="answerQ(' + qi + ',' + oi + ',this)">' + opt + '</button>'
    ).join("");
    div.innerHTML = `
      <p><b>Question ${qi + 1} :</b> ${q.q}</p>
      <div class="q-options">${buttons}</div>
      <div class="q-feedback" id="qfb-${qi}"></div>
    `;
    list.appendChild(div);
  });
}

function answerQ(qi, oi, btn){
  if (qScores[qi]!==null) return;
  const q = questions[qi];
  const fb = document.getElementById("qfb-"+qi);
  if (oi===q.answer) {
    btn.classList.add("correct");
    fb.className="q-feedback show ok";
    fb.textContent="✅ Correct ! " + q.fb;
    qScores[qi]=1;
  } else {
    btn.classList.add("wrong");
    fb.className="q-feedback show ko";
    fb.textContent="❌ Incorrect. " + q.fb;
    qScores[qi]=0;
    btn.parentElement.querySelectorAll(".q-opt")[q.answer].classList.add("correct");
  }
  btn.parentElement.querySelectorAll(".q-opt").forEach(b=>b.disabled=true);
  score = qScores.filter(s=>s===1).length;
  document.getElementById("q-score").textContent = score;
  document.getElementById("q-total").textContent = qScores.filter(s=>s!==null).length;
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
window.onload = function(){
  buildTabs();
  buildQuestions();
};
</script>
